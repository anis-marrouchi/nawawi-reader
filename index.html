<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الأربعون النووية مع جامع العلوم والحكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fbf8f1; --ink: #1f1b16; --muted: #6b6257; --rule: #e4dccb;
    --accent: #8a5a1c; --mark: #f3e2b8; --side: #f4efe3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; }
  body { background: var(--paper); color: var(--ink); font-family: "Noto Naskh Arabic", serif; display: grid;
         grid-template-columns: 300px 1fr; }
  aside { align-self: start; background: var(--side); border-inline-end: 1px solid var(--rule); height: 100vh; overflow-y: auto;
          position: sticky; top: 0; }
  aside header { padding: 20px 18px 12px; border-bottom: 1px solid var(--rule); }
  aside h1 { font-family: Amiri, serif; font-size: 22px; margin: 0 0 4px; }
  aside p { margin: 0; color: var(--muted); font-size: 13px; }
  .search { padding: 12px 18px; border-bottom: 1px solid var(--rule); }
  .search input { width: 100%; font: inherit; font-size: 15px; padding: 8px 10px; border: 1px solid var(--rule);
                  border-radius: 6px; background: #fff; }
  nav a { display: flex; gap: 10px; padding: 9px 18px; color: inherit; text-decoration: none; font-size: 15px;
          line-height: 1.6; border-bottom: 1px solid #ece5d6; }
  nav a:hover { background: #efe8d8; }
  nav a.on { background: #e9dfc9; font-weight: 600; }
  nav a span { color: var(--accent); min-width: 22px; font-family: Amiri, serif; }
  main { min-width: 0; max-width: 860px; padding: 40px 48px 120px; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
         color: var(--muted); font-size: 14px; }
  button { font: inherit; font-size: 14px; padding: 7px 14px; border-radius: 6px; border: 1px solid var(--accent);
           background: #fff; color: var(--accent); cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; }
  h2 { font-family: Amiri, serif; font-size: 30px; margin: 14px 0 18px; line-height: 1.5; }
  .matn { font-family: Amiri, serif; font-size: 25px; line-height: 2.1; background: #fff; border: 1px solid var(--rule);
          border-radius: 10px; padding: 22px 26px; white-space: pre-line; }
  details { margin: 12px 0 0; color: var(--muted); }
  details p { direction: ltr; text-align: left; font-family: Georgia, serif; font-size: 16px; line-height: 1.7;
              color: var(--ink); }
  h3 { font-family: Amiri, serif; font-size: 22px; margin: 40px 0 6px; border-bottom: 1px solid var(--rule);
       padding-bottom: 8px; }
  .para { position: relative; font-size: 18.5px; line-height: 2.05; margin: 0 0 18px; padding-inline-end: 64px; }
  .para .pg { position: absolute; inset-inline-end: 0; top: 4px; font-size: 12px; color: var(--muted);
              white-space: nowrap; }
  .para.hit { background: var(--mark); border-radius: 4px; }
  mark { background: var(--mark); }
  .results a { display: block; padding: 10px 18px; color: inherit; text-decoration: none; font-size: 14px;
               line-height: 1.7; border-bottom: 1px solid #ece5d6; }
  .results a:hover { background: #efe8d8; }
  .results small { color: var(--accent); display: block; }
  footer { margin-top: 60px; padding-top: 16px; border-top: 1px solid var(--rule); color: var(--muted);
           font-size: 13px; line-height: 1.9; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff;
           padding: 10px 18px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; }
  .toast.on { opacity: 1; }
  @media (max-width: 820px) {
    body { grid-template-columns: minmax(0, 1fr); }
    aside { height: auto; position: static; max-height: 45vh; }
    main { padding: 24px 18px 80px; }
    .para { padding-inline-end: 0; } .para .pg { position: static; display: block; }
  }
</style>
</head>
<body>
<aside>
  <header>
    <h1>الأربعون النووية</h1>
    <p>مع شرح ابن رجب: جامع العلوم والحكم</p>
  </header>
  <div class="search"><input id="q" type="search" placeholder="ابحث في الشرح كله، مثل: الشافعي"></div>
  <div class="results" id="results" hidden></div>
  <nav id="nav"></nav>
</aside>
<main id="main"><p>جارٍ التحميل…</p></main>
<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
let DATA;

// Normalise Arabic for search: drop harakat and tatweel, unify alef, ya and ta marbuta.
const norm = (s) => s.replace(/[ً-ٰٟـ]/g, "")
  .replace(/[إأآٱ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه");
// Same normalisation, plus the original index of every kept character, so previews show the source text.
function normMap(s) {
  let out = "", map = [];
  for (let i = 0; i < s.length; i++) {
    const c = norm(s[i]);
    if (c) { out += c; map.push(i); }
  }
  return [out, map];
}
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const cite = (p) => `ج${p.vol} ص${p.page}`;

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  setTimeout(() => t.classList.remove("on"), 2200);
}

function renderNav(current) {
  $("#nav").innerHTML = DATA.hadiths.map((h) =>
    `<a href="#/${h.n}" class="${h.n === current ? "on" : ""}"><span>${h.n}</span>${esc(h.short)}</a>`
  ).join("");
}

function render(n, hitIndex) {
  const h = DATA.hadiths[n - 1];
  if (!h) return;
  renderNav(n);
  const first = h.sharh[0], last = h.sharh[h.sharh.length - 1];
  $("#main").innerHTML = `
    <div class="bar">
      <span>الحديث ${n} من ${DATA.hadiths.length} · الشرح ${cite(first)} إلى ${cite(last)}</span>
      <span>
        <button id="prev">السابق</button>
        <button id="next">التالي</button>
        <button class="primary" id="copy" title="ينسخ المتن والشرح مع أرقام الصفحات لتلصقه في أي مساعد ذكاء اصطناعي">انسخ للمساعد</button>
      </span>
    </div>
    <h2>${esc(h.title)}</h2>
    <div class="matn">${esc(h.arabic)}</div>
    ${h.english ? `<details><summary>English translation</summary><p>${esc(h.english)}</p></details>` : ""}
    <h3>شرح ابن رجب الحنبلي</h3>
    ${h.sharh.map((p, i) => `<p class="para${i === hitIndex ? " hit" : ""}" id="p${i}"><span class="pg">${cite(p)}</span>${esc(p.text)}</p>`).join("")}
    <footer>
      <div><b>المتن:</b> ${esc(DATA.sources.matn)}</div>
      <div><b>الشرح:</b> ${esc(DATA.sources.sharh)}</div>
      <div>كل كلمة هنا منقولة من المصدرين، ولا يكتب البرنامج شيئًا من عنده. أرقام الصفحات من علامات مشروع OpenITI.</div>
    </footer>`;
  $("#prev").onclick = () => n > 1 && (location.hash = `#/${n - 1}`);
  $("#next").onclick = () => n < DATA.hadiths.length && (location.hash = `#/${n + 1}`);
  $("#copy").onclick = () => copyForAssistant(h);
  if (hitIndex != null) document.getElementById(`p${hitIndex}`)?.scrollIntoView({ block: "center" });
  else window.scrollTo(0, 0);
}

function copyForAssistant(h) {
  const text = [
    "أجب عن أسئلتي من النص التالي فقط. اذكر الجزء والصفحة لكل معلومة، مثل (ج1 ص59).",
    "إن لم يكن الجواب في النص فقل: ليس في هذا الموضع من الشرح. لا تفتِ ولا تضف من عندك.",
    "",
    `المتن: ${h.title}`,
    h.arabic,
    "",
    "الشرح: جامع العلوم والحكم لابن رجب الحنبلي، تحقيق الأرناؤوط وباجس، مؤسسة الرسالة، ط7 2001",
    ...h.sharh.map((p) => `(${cite(p)}) ${p.text}`),
  ].join("\n");
  navigator.clipboard.writeText(text).then(
    () => toast(`نُسخ الحديث ${h.n} مع شرحه (${text.length.toLocaleString("ar")} حرفًا)`),
    () => toast("تعذّر النسخ"));
}

function search(q) {
  const box = $("#results");
  const nq = norm(q.trim());
  if (nq.length < 2) { box.hidden = true; return; }
  const hits = [];
  for (const h of DATA.hadiths) {
    h.sharh.forEach((p, i) => {
      const [np, map] = normMap(p.text);
      const at = np.indexOf(nq);
      if (at >= 0) hits.push({ h, i, p, from: map[at], to: map[at + nq.length - 1] + 1 });
    });
  }
  box.hidden = false;
  box.innerHTML = `<a><small>${hits.length} موضعًا</small></a>` + hits.slice(0, 80).map(({ h, i, p, from, to }) => {
    const t = p.text;
    const snip = esc(t.slice(Math.max(0, from - 40), from)) + "<mark>" + esc(t.slice(from, to)) + "</mark>" + esc(t.slice(to, to + 50));
    return `<a href="#/${h.n}/${i}"><small>الحديث ${h.n} · ${cite(p)}</small>…${snip}…</a>`;
  }).join("");
}

function route() {
  const [, n, i] = location.hash.split("/");
  render(Number(n) || 1, i != null ? Number(i) : undefined);
}

fetch("data.json").then((r) => r.json()).then((d) => {
  DATA = d;
  let timer;
  $("#q").addEventListener("input", (e) => { clearTimeout(timer); timer = setTimeout(() => search(e.target.value), 150); });
  window.addEventListener("hashchange", route);
  route();
});
</script>
</body>
</html>
